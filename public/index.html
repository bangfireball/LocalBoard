<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c66e4">
  <title>My Work Board</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="logo" id="boards-button" aria-label="Open boards" title="Boards (B)"><span>▦</span> Board</button>
    <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search"></label>
    <a class="api-link" href="/api/openapi.json" target="_blank">API</a>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
  <aside id="boards-sidebar" class="boards-sidebar" aria-hidden="true">
    <header><h2>Your boards</h2><button id="close-sidebar" aria-label="Close boards">×</button></header>
    <div id="boards-list" class="boards-list"></div>
    <form id="new-board-form" class="new-board-form">
      <label for="new-board-name">Create a board</label>
      <input id="new-board-name" name="name" maxlength="80" placeholder="Board title" required>
      <button type="submit">Create board</button>
    </form>
    <p class="sidebar-hint"><kbd>B</kbd> opens and closes this menu</p>
  </aside>

  <main>
    <div class="board-bar">
      <h1 id="board-title" title="Click to rename">My Work Board</h1>
      <span class="divider"></span>
      <span class="board-type">Personal board</span>
      <button id="change-background" class="bar-button" title="Change board color">◐</button>
    </div>
    <div id="board" class="board" aria-label="Kanban board"></div>
  </main>

  <dialog id="card-dialog">
    <form id="card-form">
      <button type="button" class="close" data-close aria-label="Close">×</button>
      <input type="hidden" name="id">
      <div class="modal-title"><span class="modal-icon">▤</span><div><input name="title" required maxlength="160" aria-label="Card title"><p>in list <strong id="card-list-name"></strong></p></div></div>
      <div class="modal-body">
        <section class="details">
          <label>Description<textarea name="description" rows="6" placeholder="Add a more detailed description…"></textarea></label>
          <label>Checklist <small>One item per line. Start completed items with [x].</small><textarea name="checklist" rows="5" placeholder="Write tests&#10;[x] Create the issue"></textarea></label>
          <section class="photo-section"><div class="section-heading"><strong>Photos</strong><label class="photo-upload">＋ Add photos<input id="photo-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple></label></div><div id="photo-gallery" class="photo-gallery"></div><small>JPEG, PNG, GIF, or WebP. Maximum 5 MB each.</small></section>
        </section>
        <aside>
          <label>List<select name="listId" id="list-select"></select></label>
          <label>Labels<input name="labels" placeholder="backend, urgent"></label>
          <label>Due date<input name="dueDate" type="date"></label>
          <button type="button" class="danger" id="delete-card">Delete card</button>
        </aside>
      </div>
      <div class="modal-actions"><button type="button" class="muted-button" data-close>Cancel</button><button class="save-button" type="submit">Save</button></div>
    </form>
  </dialog>

  <dialog id="text-dialog" class="small-modal">
    <form id="text-dialog-form">
      <button type="button" class="close" data-text-cancel aria-label="Close">×</button>
      <h2 id="text-dialog-title">Edit</h2>
      <label><span id="text-dialog-label">Value</span><input id="text-dialog-input" maxlength="160" required></label>
      <p id="text-dialog-help" class="dialog-help"></p>
      <div class="modal-actions"><button type="button" class="muted-button" data-text-cancel>Cancel</button><button id="text-dialog-submit" class="save-button">Save</button></div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="small-modal">
    <form id="confirm-dialog-form">
      <button type="button" class="close" data-confirm-cancel aria-label="Close">×</button>
      <h2 id="confirm-dialog-title">Are you sure?</h2>
      <p id="confirm-dialog-message" class="dialog-message"></p>
      <div class="modal-actions"><button type="button" class="muted-button" data-confirm-cancel>Cancel</button><button id="confirm-dialog-submit" class="danger">Delete</button></div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
