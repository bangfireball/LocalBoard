services:
  localboard:
    build: .
    container_name: localboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_FILE: /app/data/board.json
      # Recommended: set this in a .env file before exposing the app.
      KANBAN_API_KEY: ${KANBAN_API_KEY:-}
    volumes:
      - localboard_data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  localboard_data:
