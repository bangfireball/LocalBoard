services:
  localboard:
    build: .
    container_name: localboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATA_FILE: /app/data/board.json
      # Required for the published LAN port. Set it in a .env file.
      KANBAN_API_KEY: ${KANBAN_API_KEY:?Set KANBAN_API_KEY in .env}
    volumes:
      - localboard_data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  localboard_data:
